name: Inject GitHub Token
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject token
        run: |
          sed -i "s|window.GITHUB_TOKEN |||window.GITHUB_TOKEN = '${{ secrets.DASASDASD }}'|" index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
