name: Deploy to GitHub Pages (with Secret Token)
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GitHub Token
        run: |
          sed -i "s|window.GITHUB_TOKEN |||window.GITHUB_TOKEN = '${{ secrets.DASASDASD }}'|" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
