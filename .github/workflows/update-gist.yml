name: Deploy Article Hub
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🧩 Inject token safely
      - name: Inject GitHub Token
        shell: bash
        run: |
          cp index.html index.html.bak
          sed -i 's|window\.GITHUB_TOKEN || ""|window.GITHUB_TOKEN || "'"${{ secrets.DASASDASD }}"'"|' index.html

      # 🚀 Deploy to GitHub Pages
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

      # 🧹 Restore original file
      - name: Restore index.html
        run: mv index.html.bak index.html
