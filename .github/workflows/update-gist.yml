name: Deploy Article Hub
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GitHub Token
        shell: bash
        run: |
          cp index.html index.html.bak
          sed -i 's|window.GITHUB_TOKEN || ""|window.GITHUB_TOKEN || "${{ secrets.DASASDASD }}"|' index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./

      - name: Restore original
        run: mv index.html.bak index.html
