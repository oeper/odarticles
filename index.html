<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Hub</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Icons
    const Github = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>;
    const Plus = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const Eye = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const Edit3 = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
    const Trash2 = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const Image = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const AlertCircle = ({size = 20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;

    // Markdown parser
    const parseMarkdown = (md) => {
      let html = md;
      html = html.replace(/^### (.*$)/gim, '<h3 class="text-xl font-semibold mt-4 mb-2">$1</h3>');
      html = html.replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-6 mb-3">$1</h2>');
      html = html.replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold mt-8 mb-4">$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold">$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em class="italic">$1</em>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-blue-600 hover:underline">$1</a>');
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="max-w-full rounded-lg my-4" />');
      html = html.replace(/```([^`]+)```/g, '<pre class="bg-gray-100 p-3 rounded my-3 overflow-x-auto"><code>$1</code></pre>');
      html = html.replace(/`([^`]+)`/g, '<code class="bg-gray-100 px-1.5 py-0.5 rounded text-sm">$1</code>');
      html = html.replace(/\n\n/g, '</p><p class="mb-3">');
      html = html.replace(/\n/g, '<br />');
      return '<p class="mb-3">' + html + '</p>';
    };

    function ArticlePlatform() {
      const [articles, setArticles] = useState([]);
      const [view, setView] = useState('setup');
      const [currentArticle, setCurrentArticle] = useState(null);
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({
        title: '',
        author: '',
        content: '',
        coverImage: ''
      });
      const [loading, setLoading] = useState(false);
      const [config, setConfig] = useState({
        gistId: '',
        token: ''
      });
      const [tempConfig, setTempConfig] = useState({
        gistId: '',
        token: ''
      });
      const [error, setError] = useState('');

      useEffect(() => {
        const saved = localStorage.getItem('github-article-config');
        if (saved) {
          const parsed = JSON.parse(saved);
          setConfig(parsed);
          if (parsed.gistId) {
            setView('list');
            loadArticles(parsed.gistId, parsed.token);
          }
        }
      }, []);

      const saveConfig = () => {
        if (!tempConfig.gistId) {
          setError('Gist ID is required');
          return;
        }
        localStorage.setItem('github-article-config', JSON.stringify(tempConfig));
        setConfig(tempConfig);
        setView('list');
        loadArticles(tempConfig.gistId, tempConfig.token);
      };

      const loadArticles = async (gistId, token) => {
        setLoading(true);
        setError('');
        try {
          const headers = {};
          if (token) {
            headers['Authorization'] = `token ${token}`;
          }
          
          const response = await fetch(`https://api.github.com/gists/${gistId}`, { headers });
          
          if (!response.ok) {
            throw new Error('Failed to load articles. Check your Gist ID and token.');
          }
          
          const gist = await response.json();
          const articlesFile = gist.files['articles.json'];
          
          if (articlesFile) {
            const data = JSON.parse(articlesFile.content);
            setArticles(data.sort((a, b) => b.timestamp - a.timestamp));
          } else {
            setArticles([]);
          }
        } catch (err) {
          setError(err.message);
          setArticles([]);
        } finally {
          setLoading(false);
        }
      };

      const saveArticles = async (updatedArticles) => {
        if (!config.token) {
          setError('GitHub token is required to save articles');
          return false;
        }

        try {
          const response = await fetch(`https://api.github.com/gists/${config.gistId}`, {
            method: 'PATCH',
            headers: {
              'Authorization': `token ${config.token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              files: {
                'articles.json': {
                  content: JSON.stringify(updatedArticles, null, 2)
                }
              }
            })
          });

          if (!response.ok) {
            throw new Error('Failed to save articles');
          }

          setArticles(updatedArticles.sort((a, b) => b.timestamp - a.timestamp));
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        
        const article = {
          id: editingId || `article_${Date.now()}`,
          ...formData,
          timestamp: editingId ? articles.find(a => a.id === editingId)?.timestamp || Date.now() : Date.now()
        };

        let updatedArticles;
        if (editingId) {
          updatedArticles = articles.map(a => a.id === editingId ? article : a);
        } else {
          updatedArticles = [article, ...articles];
        }

        const success = await saveArticles(updatedArticles);
        if (success) {
          setFormData({ title: '', author: '', content: '', coverImage: '' });
          setEditingId(null);
          setView('list');
        }
      };

      const handleDelete = async (id) => {
        if (window.confirm('Are you sure you want to delete this article?')) {
          const updatedArticles = articles.filter(a => a.id !== id);
          const success = await saveArticles(updatedArticles);
          if (success && currentArticle?.id === id) {
            setCurrentArticle(null);
            setView('list');
          }
        }
      };

      const handleEdit = (article) => {
        setFormData({
          title: article.title,
          author: article.author,
          content: article.content,
          coverImage: article.coverImage
        });
        setEditingId(article.id);
        setView('create');
      };

      const viewArticle = (article) => {
        setCurrentArticle(article);
        setView('view');
      };

      if (view === 'setup') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-6">
            <div className="bg-white rounded-xl shadow-lg p-8 max-w-2xl w-full">
              <div className="flex items-center gap-3 mb-6">
                <Github />
                <h1 className="text-3xl font-bold text-gray-900">GitHub Article Setup</h1>
              </div>
              
              <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <h3 className="font-semibold text-blue-900 mb-2">Quick Setup Guide:</h3>
                <ol className="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                  <li>Go to <a href="https://gist.github.com" target="_blank" rel="noopener noreferrer" className="underline">gist.github.com</a></li>
                  <li>Create a new gist with filename: <code className="bg-blue-100 px-1 rounded">articles.json</code></li>
                  <li>Add content: <code className="bg-blue-100 px-1 rounded">[]</code> (empty array)</li>
                  <li>Make it <strong>Public</strong> and click "Create public gist"</li>
                  <li>Copy the Gist ID from URL (e.g., abc123def456...)</li>
                  <li>Create a token at <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener noreferrer" className="underline">github.com/settings/tokens</a></li>
                  <li>Give it "gist" scope and generate token</li>
                </ol>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    Gist ID <span className="text-red-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={tempConfig.gistId}
                    onChange={(e) => setTempConfig({...tempConfig, gistId: e.target.value})}
                    placeholder="abc123def456..."
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  />
                  <p className="text-xs text-gray-500 mt-1">Found in your gist URL after the last /</p>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    GitHub Personal Access Token <span className="text-red-500">*</span>
                  </label>
                  <input
                    type="password"
                    value={tempConfig.token}
                    onChange={(e) => setTempConfig({...tempConfig, token: e.target.value})}
                    placeholder="ghp_..."
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  />
                  <p className="text-xs text-gray-500 mt-1">Required to create/edit/delete articles</p>
                </div>

                {error && (
                  <div className="bg-red-50 border border-red-200 rounded-lg p-3 flex items-start gap-2">
                    <AlertCircle size={18} />
                    <p className="text-sm text-red-800">{error}</p>
                  </div>
                )}

                <button
                  onClick={saveConfig}
                  className="w-full bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-medium"
                >
                  Connect to GitHub
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center">
            <div className="text-lg text-gray-600">Loading articles...</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
          <div className="max-w-5xl mx-auto p-6">
            <div className="mb-8 flex items-center justify-between">
              <div>
                <h1 className="text-4xl font-bold text-gray-900 mb-2">Article Hub</h1>
                <p className="text-gray-600">Powered by GitHub Gists</p>
              </div>
              <button
                onClick={() => setView('setup')}
                className="text-sm text-gray-600 hover:text-gray-900 underline"
              >
                Change Settings
              </button>
            </div>

            {error && (
              <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start gap-2">
                <AlertCircle size={20} />
                <p className="text-sm text-red-800">{error}</p>
              </div>
            )}

            {view === 'list' && (
              <div>
                <div className="mb-6">
                  <button
                    onClick={() => setView('create')}
                    className="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 flex items-center gap-2 transition-colors"
                  >
                    <Plus />
                    New Article
                  </button>
                </div>

                {articles.length === 0 ? (
                  <div className="bg-white rounded-xl shadow-sm p-12 text-center">
                    <p className="text-gray-500 text-lg mb-4">No articles yet</p>
                    <p className="text-gray-400">Create your first article to get started!</p>
                  </div>
                ) : (
                  <div className="grid gap-6">
                    {articles.map((article) => (
                      <div key={article.id} className="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                        {article.coverImage && (
                          <img 
                            src={article.coverImage} 
                            alt={article.title}
                            className="w-full h-48 object-cover"
                          />
                        )}
                        <div className="p-6">
                          <h2 className="text-2xl font-bold text-gray-900 mb-2">{article.title}</h2>
                          <div className="flex items-center text-sm text-gray-500 mb-4">
                            <span>By {article.author}</span>
                            <span className="mx-2">•</span>
                            <span>{new Date(article.timestamp).toLocaleDateString()}</span>
                          </div>
                          <p className="text-gray-600 mb-4 line-clamp-2">
                            {article.content.substring(0, 150)}...
                          </p>
                          <div className="flex gap-2">
                            <button
                              onClick={() => viewArticle(article)}
                              className="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors"
                            >
                              <Eye />
                              Read
                            </button>
                            <button
                              onClick={() => handleEdit(article)}
                              className="flex items-center gap-2 px-4 py-2 bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors"
                            >
                              <Edit3 />
                              Edit
                            </button>
                            <button
                              onClick={() => handleDelete(article.id)}
                              className="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors"
                            >
                              <Trash2 />
                              Delete
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {view === 'create' && (
              <div className="bg-white rounded-xl shadow-sm p-8">
                <h2 className="text-2xl font-bold text-gray-900 mb-6">
                  {editingId ? 'Edit Article' : 'Create New Article'}
                </h2>
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Title
                    </label>
                    <input
                      type="text"
                      value={formData.title}
                      onChange={(e) => setFormData({...formData, title: e.target.value})}
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Author
                    </label>
                    <input
                      type="text"
                      value={formData.author}
                      onChange={(e) => setFormData({...formData, author: e.target.value})}
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2 flex items-center gap-2">
                      <Image />
                      Cover Image URL (optional)
                    </label>
                    <input
                      type="url"
                      value={formData.coverImage}
                      onChange={(e) => setFormData({...formData, coverImage: e.target.value})}
                      placeholder="https://example.com/image.jpg"
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Content (Markdown supported)
                    </label>
                    <textarea
                      value={formData.content}
                      onChange={(e) => setFormData({...formData, content: e.target.value})}
                      rows={15}
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm"
                      placeholder="# Heading 1&#10;## Heading 2&#10;&#10;**Bold text** and *italic text*&#10;&#10;![Image](url)&#10;[Link](url)&#10;&#10;`code` or ```code block```"
                    />
                    <p className="text-xs text-gray-500 mt-2">
                      Supports: Headers (#), Bold (**), Italic (*), Links, Images, Code
                    </p>
                  </div>

                  <div className="flex gap-3">
                    <button
                      onClick={handleSubmit}
                      className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                      disabled={!formData.title || !formData.author || !formData.content}
                    >
                      {editingId ? 'Update Article' : 'Publish Article'}
                    </button>
                    <button
                      onClick={() => {
                        setFormData({ title: '', author: '', content: '', coverImage: '' });
                        setEditingId(null);
                        setView('list');
                      }}
                      className="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </div>
            )}

            {view === 'view' && currentArticle && (
              <div>
                <button
                  onClick={() => setView('list')}
                  className="mb-6 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors"
                >
                  ← Back to Articles
                </button>
                
                <article className="bg-white rounded-xl shadow-sm overflow-hidden">
                  {currentArticle.coverImage && (
                    <img 
                      src={currentArticle.coverImage} 
                      alt={currentArticle.title}
                      className="w-full h-64 object-cover"
                    />
                  )}
                  <div className="p-8">
                    <h1 className="text-4xl font-bold text-gray-900 mb-4">
                      {currentArticle.title}
                    </h1>
                    <div className="flex items-center text-gray-600 mb-8 pb-8 border-b">
                      <span className="font-medium">{currentArticle.author}</span>
                      <span className="mx-3">•</span>
                      <span>{new Date(currentArticle.timestamp).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                      })}</span>
                    </div>
                    <div 
                      className="prose prose-lg max-w-none text-gray-800"
                      dangerouslySetInnerHTML={{ __html: parseMarkdown(currentArticle.content) }}
                    />
                  </div>
                </article>
              </div>
            )}
          </div>
        </div>
      );
    }
    
    ReactDOM.render(<ArticlePlatform />, document.getElementById('root'));
  </script>
</body>
</html>
