<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODArticles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <header class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">ODArticles</h1>
    <button onclick="loadArticles()" class="bg-blue-800 px-3 py-1 rounded">🔄 Refresh</button>
  </header>

  <main class="max-w-4xl mx-auto mt-8 p-4 bg-white shadow rounded">
    <h2 class="text-lg font-semibold mb-4">📝 Create New Article</h2>
    <div class="space-y-3">
      <input id="title" type="text" placeholder="Title" class="border p-2 rounded w-full" />
      <textarea id="content" placeholder="Content..." class="border p-2 rounded w-full h-32"></textarea>
      <input id="author" type="text" placeholder="Author" class="border p-2 rounded w-full" />
      <input id="cover" type="url" placeholder="Cover Image URL (optional)" class="border p-2 rounded w-full" />

      <div>
        <label class="block mb-1 font-semibold">Upload File (≤ 50 MB)</label>
        <input type="file" id="uploadFile" class="border p-2 rounded w-full" onchange="handleUpload(event)" />
        <p id="uploadStatus" class="text-sm text-gray-500 mt-1"></p>
      </div>

      <button onclick="createArticle()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Publish Article
      </button>
    </div>
  </main>

  <section id="articles" class="max-w-4xl mx-auto mt-8 space-y-6 p-4"></section>

  <script>
    const CLOUD_NAME = "dsjaa8rko";
    const UPLOAD_PRESET = "asd";
    const GIST_ID = "af5b47cde42b507af585e30b7b69418f";
    const REPO = "oeper/odarticles";
    const MAX_SIZE = 50 * 1024 * 1024;

    let articles = [];

    async function handleUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > MAX_SIZE) {
        alert("File too large (max 50 MB)");
        return;
      }

      const status = document.getElementById("uploadStatus");
      status.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.secure_url) {
          document.getElementById("cover").value = data.secure_url;
          status.textContent = "✅ Upload successful!";
        } else status.textContent = "❌ Upload failed.";
      } catch {
        status.textContent = "❌ Upload error.";
      }
    }

    async function loadArticles() {
      document.getElementById("articles").innerHTML = "<p>Loading...</p>";
      try {
        const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
        const gist = await res.json();
        const file = gist.files["articles.json"];
        articles = file ? JSON.parse(file.content) : [];
        renderArticles();
      } catch {
        document.getElementById("articles").innerHTML = "<p>❌ Failed to load articles.</p>";
      }
    }

    function renderArticles() {
      const container = document.getElementById("articles");
      container.innerHTML = "";
      if (!articles.length) {
        container.innerHTML = "<p class='text-gray-500'>No articles yet.</p>";
        return;
      }

      for (const a of articles.sort((a, b) => b.timestamp - a.timestamp)) {
        const div = document.createElement("div");
        div.className = "bg-white p-6 rounded shadow";
        div.innerHTML = `
          ${a.coverImage ? `<img src="${a.coverImage}" class="w-full h-64 object-cover rounded mb-4" />` : ""}
          <h2 class="text-2xl font-bold mb-1">${a.title}</h2>
          <p class="text-sm text-gray-500 mb-3">By ${a.author} • ${new Date(a.timestamp).toLocaleString()}</p>
          <p class="mb-4 whitespace-pre-wrap">${a.content}</p>
          <div id="replies-${a.id}" class="space-y-3 mt-4"></div>
          <div class="mt-3">
            <input id="reply-author-${a.id}" placeholder="Your name" class="border p-1 rounded mr-2" />
            <input id="reply-content-${a.id}" placeholder="Write a reply..." class="border p-1 rounded w-1/2 mr-2" />
            <button onclick="postReply('${a.id}')" class="bg-blue-600 text-white px-2 py-1 rounded">Reply</button>
          </div>
        `;
        container.appendChild(div);
        renderReplies(a.id, a.replies || []);
      }
    }

    function renderReplies(articleId, replies, depth = 0) {
      const container = document.getElementById(`replies-${articleId}`);
      container.innerHTML = "";
      for (const r of replies) {
        const div = document.createElement("div");
        div.className = `ml-${depth * 4} border-l pl-3`;
        const reacted = JSON.parse(localStorage.getItem(`reacted-${r.id}`) || "[]");
        div.innerHTML = `
          <p><strong>${r.author}</strong> <span class="text-sm text-gray-400">(${new Date(r.timestamp).toLocaleString()})</span></p>
          <p class="mb-1 whitespace-pre-wrap">${r.content}</p>
          <div class="flex gap-2 mb-2">
            ${["👍","❤️","😂","😮","😢","😡"].map(emoji => `
              <button onclick="reactToReply('${articleId}','${r.id}','${emoji}')" class="${reacted.includes(emoji) ? 'opacity-50' : ''}">
                ${emoji} ${(r.reactions && r.reactions[emoji]) || 0}
              </button>`).join("")}
          </div>
          ${depth < 1 ? `
            <div class="mb-3">
              <input id="subreply-author-${r.id}" placeholder="Your name" class="border p-1 rounded mr-1" />
              <input id="subreply-content-${r.id}" placeholder="Reply..." class="border p-1 rounded w-1/2 mr-1" />
              <button onclick="postReply('${articleId}','${r.id}')" class="bg-gray-200 px-2 py-1 rounded">↩</button>
            </div>` : ""}
          <div id="replies-${r.id}"></div>
        `;
        container.appendChild(div);
        renderReplies(r.id, r.replies || [], depth + 1);
      }
    }

    async function postReply(articleId, parentId = null) {
      const author = document.getElementById(parentId ? `subreply-author-${parentId}` : `reply-author-${articleId}`).value.trim();
      const content = document.getElementById(parentId ? `subreply-content-${parentId}` : `reply-content-${articleId}`).value.trim();
      if (!author || !content) return alert("Name and reply are required.");

      const reply = {
        id: "reply_" + Date.now(),
        author,
        content,
        timestamp: Date.now(),
        reactions: {},
        replies: []
      };

      const article = findArticleById(articleId);
      if (!article.replies) article.replies = [];
      if (parentId) {
        const parent = findReply(article.replies, parentId);
        parent.replies.push(reply);
      } else {
        article.replies.push(reply);
      }
      await saveArticles();
      renderArticles();
    }

    async function reactToReply(articleId, replyId, emoji) {
      const reactedKey = `reacted-${replyId}`;
      const reacted = JSON.parse(localStorage.getItem(reactedKey) || "[]");
      if (reacted.includes(emoji)) return; // already reacted

      const article = findArticleById(articleId);
      const reply = findReply(article.replies, replyId);
      if (!reply.reactions) reply.reactions = {};
      reply.reactions[emoji] = (reply.reactions[emoji] || 0) + 1;

      reacted.push(emoji);
      localStorage.setItem(reactedKey, JSON.stringify(reacted));

      await saveArticles();
      renderArticles();
    }

    function findArticleById(id) {
      for (const a of articles) {
        if (a.id === id) return a;
        const nested = findReply(a.replies || [], id);
        if (nested) return a;
      }
    }

    function findReply(replies, id) {
      for (const r of replies) {
        if (r.id === id) return r;
        const found = findReply(r.replies || [], id);
        if (found) return found;
      }
      return null;
    }

    async function createArticle() {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();
      const author = document.getElementById("author").value.trim();
      const cover = document.getElementById("cover").value.trim();

      if (!title || !author || !content) {
        alert("Please fill all required fields.");
        return;
      }

      const newArticle = {
        id: "article_" + Date.now(),
        title,
        author,
        content,
        coverImage: cover,
        timestamp: Date.now(),
        replies: []
      };

      articles.unshift(newArticle);
      await saveArticles();
      renderArticles();
    }

    async function saveArticles() {
      // trigger GitHub Action
      await fetch("https://api.github.com/repos/oeper/odarticles/dispatches", {
        method: "POST",
        headers: {
          "Authorization": "token GITHUB_TOKEN_PLACEHOLDER",
          "Accept": "application/vnd.github.everest-preview+json"
        },
        body: JSON.stringify({
          event_type: "update-gist",
          client_payload: {
            gist_id: GIST_ID,
            articles: articles,
            json: JSON.stringify({ gist_id: GIST_ID, articles: articles })
          }
        })
      });
    }

    loadArticles();
  </script>
</body>
</html>
