<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>asdasdasdb</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ⚙️ CONFIGURATION
    const GIST_ID = "af5b47cde42b507af585e30b7b69418f";
 const GITHUB_TOKEN = window.GITHUB_TOKEN || "";
 // injected automatically by GitHub Action
    const ADMIN_PASSWORD =
      "76VRB^vR*%^4ec&%Ex%JY$D5u64DU4Crv65R*B^%&r*^&%BR*^&%RB765E&C^$%WE64#w@#$^Qx2%Q^$@#CE53dD45CD46%&D4^%^&rfcT^f^%TC";

    // Simple Markdown parser
    const parseMarkdown = (md) => {
      let html = md;
      html = html.replace(/^### (.*$)/gim, "<h3 class='text-xl font-semibold mt-4 mb-2'>$1</h3>");
      html = html.replace(/^## (.*$)/gim, "<h2 class='text-2xl font-bold mt-6 mb-3'>$1</h2>");
      html = html.replace(/^# (.*$)/gim, "<h1 class='text-3xl font-bold mt-8 mb-4'>$1</h1>");
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a href='$2' class='text-blue-600 hover:underline'>$1</a>");
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, "<img src='$2' alt='$1' class='rounded-lg my-4' />");
      html = html.replace(/\n\n/g, "</p><p>");
      html = html.replace(/\n/g, "<br />");
      return "<p>" + html + "</p>";
    };

    function ArticlePlatform() {
      const [articles, setArticles] = useState([]);
      const [view, setView] = useState("list");
      const [currentArticle, setCurrentArticle] = useState(null);
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({ title: "", author: "", content: "", coverImage: "" });
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [deletePassword, setDeletePassword] = useState("");
      const [showDeletePrompt, setShowDeletePrompt] = useState(null);

      useEffect(() => {
        loadArticles();
      }, []);

      const loadArticles = async () => {
        setLoading(true);
        setError("");
        try {
          const response = await fetch(`https://api.github.com/gists/${GIST_ID}`);
          if (!response.ok) throw new Error("Failed to load articles");
          const gist = await response.json();
          const file = gist.files["articles.json"];
          const data = file ? JSON.parse(file.content) : [];
          setArticles(data.sort((a, b) => b.timestamp - a.timestamp));
        } catch (err) {
          setError(err.message);
          setArticles([]);
        } finally {
          setLoading(false);
        }
      };

      const saveArticles = async (updatedArticles) => {
        if (!GITHUB_TOKEN) {
          setError("GitHub token missing (not injected yet). Try refreshing.");
          return false;
        }

        try {
          const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
            method: "PATCH",
            headers: {
              Authorization: `token ${GITHUB_TOKEN}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              files: { "articles.json": { content: JSON.stringify(updatedArticles, null, 2) } },
            }),
          });

          if (!response.ok) throw new Error("Failed to save articles");
          setArticles(updatedArticles.sort((a, b) => b.timestamp - a.timestamp));
          return true;
        } catch (err) {
          setError(err.message);
          return false;
        }
      };

      const handleSubmit = async () => {
        if (!formData.title || !formData.author || !formData.content) {
          alert("Please fill in all required fields");
          return;
        }

        const article = {
          id: editingId || `article_${Date.now()}`,
          ...formData,
          timestamp: editingId ? articles.find((a) => a.id === editingId)?.timestamp || Date.now() : Date.now(),
        };

        const updatedArticles = editingId
          ? articles.map((a) => (a.id === editingId ? article : a))
          : [article, ...articles];

        const success = await saveArticles(updatedArticles);
        if (success) {
          setFormData({ title: "", author: "", content: "", coverImage: "" });
          setEditingId(null);
          setView("list");
        }
      };

      const handleDeleteConfirm = async (id) => {
        if (deletePassword !== ADMIN_PASSWORD) {
          alert("Incorrect password");
          return;
        }

        const updatedArticles = articles.filter((a) => a.id !== id);
        const success = await saveArticles(updatedArticles);
        if (success) {
          setShowDeletePrompt(null);
          setCurrentArticle(null);
          setView("list");
        }
      };

      const ArticleCard = ({ article }) => (
        <div className="bg-white shadow-sm rounded-xl overflow-hidden hover:shadow-md transition">
          {article.coverImage && <img src={article.coverImage} className="w-full h-48 object-cover" />}
          <div className="p-6">
            <h2 className="text-2xl font-bold mb-2">{article.title}</h2>
            <div className="text-gray-500 text-sm mb-4">
              By {article.author} • {new Date(article.timestamp).toLocaleDateString()}
            </div>
            <p className="text-gray-700 mb-4">{article.content.substring(0, 150)}...</p>
            <button onClick={() => { setCurrentArticle(article); setView("view"); }} className="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100">Read</button>
            <button onClick={() => { setFormData(article); setEditingId(article.id); setView("create"); }} className="ml-2 px-4 py-2 bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100">Edit</button>
            <button onClick={() => setShowDeletePrompt(article.id)} className="ml-2 px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100">Delete</button>

            {showDeletePrompt === article.id && (
              <div className="mt-3 p-3 border rounded bg-red-50">
                <input
                  type="password"
                  value={deletePassword}
                  onChange={(e) => setDeletePassword(e.target.value)}
                  placeholder="Admin password"
                  className="border px-2 py-1 rounded mr-2"
                />
                <button onClick={() => handleDeleteConfirm(article.id)} className="bg-red-600 text-white px-3 py-1 rounded">Confirm</button>
              </div>
            )}
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="max-w-5xl mx-auto p-6">
            <h1 className="text-4xl font-bold mb-4">📰 Article Hub</h1>

            {error && <div className="bg-red-100 border border-red-300 text-red-700 p-3 rounded mb-4">{error}</div>}

            {view === "list" && (
              <>
                <button onClick={() => setView("create")} className="mb-6 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700">
                  + New Article
                </button>
                {articles.length ? (
                  <div className="grid gap-6">{articles.map((a) => <ArticleCard key={a.id} article={a} />)}</div>
                ) : (
                  <p className="text-gray-500">No articles yet.</p>
                )}
              </>
            )}

            {view === "create" && (
              <div className="bg-white p-6 rounded-xl shadow">
                <h2 className="text-2xl font-bold mb-4">{editingId ? "Edit Article" : "Create New Article"}</h2>
                <input type="text" placeholder="Title" value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  className="w-full mb-3 border px-3 py-2 rounded" />
                <input type="text" placeholder="Author" value={formData.author}
                  onChange={(e) => setFormData({ ...formData, author: e.target.value })}
                  className="w-full mb-3 border px-3 py-2 rounded" />
                <input type="url" placeholder="Cover image URL" value={formData.coverImage}
                  onChange={(e) => setFormData({ ...formData, coverImage: e.target.value })}
                  className="w-full mb-3 border px-3 py-2 rounded" />
                <textarea placeholder="Content (Markdown supported)" value={formData.content}
                  onChange={(e) => setFormData({ ...formData, content: e.target.value })}
                  rows={10} className="w-full mb-3 border px-3 py-2 rounded font-mono"></textarea>
                <div className="flex gap-3">
                  <button onClick={handleSubmit} className="bg-blue-600 text-white px-5 py-2 rounded">Save</button>
                  <button onClick={() => { setView("list"); setEditingId(null); }} className="bg-gray-300 px-5 py-2 rounded">Cancel</button>
                </div>
              </div>
            )}

            {view === "view" && currentArticle && (
              <div className="bg-white p-6 rounded-xl shadow">
                <button onClick={() => setView("list")} className="mb-4 bg-gray-200 px-3 py-1 rounded">← Back</button>
                {currentArticle.coverImage && (
                  <img src={currentArticle.coverImage} className="w-full h-64 object-cover rounded mb-6" />
                )}
                <h1 className="text-3xl font-bold mb-2">{currentArticle.title}</h1>
                <p className="text-gray-500 mb-4">
                  {currentArticle.author} • {new Date(currentArticle.timestamp).toLocaleDateString()}
                </p>
                <div
                  className="prose max-w-none"
                  dangerouslySetInnerHTML={{ __html: parseMarkdown(currentArticle.content) }}
                ></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<ArticlePlatform />, document.getElementById("root"));
  </script>
</body>
</html>
